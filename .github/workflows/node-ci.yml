name: Node CI

# Reusable workflow consumed by every 8knots app. Gates: lint (optional),
# typecheck, test (optional), build (optional).
#
# Why a reusable workflow: all apps run the same stack (Next.js 16 + TS
# strict + Node 22). Centralizing avoids drift between repos and means a
# single place to bump Node, add cache hits, or extend the matrix.
#
# Auth for GitHub Packages: NPM_TOKEN is set from secrets.GITHUB_TOKEN
# during install. Consumers consuming @8knots-consulting/* need to declare
# `permissions: { packages: read, contents: read }` in their calling
# workflow.
#
# Consumer example (in any app repo, e.g. recharge/.github/workflows/ci.yml):
#
#   name: CI
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#     packages: read
#   jobs:
#     ci:
#       uses: 8knots-consulting/.github/.github/workflows/node-ci.yml@main
#       with:
#         node-version: "22"
#         package-manager: npm
#         run-lint: true
#         run-test: true
#         # Optional (Plan-Doc 19 §2.3): Coverage-Report als CI-Artifact.
#         # Sichtbarkeit-only, kein Gate. Aktivierung per App nach Pilot.
#         run-coverage: true

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to use.
        type: string
        default: "22"
      package-manager:
        description: 'Package manager: "npm" or "pnpm".'
        type: string
        default: npm
      run-lint:
        description: Run lint step. Some apps don't have a lint script yet.
        type: boolean
        default: true
      run-test:
        description: Run test step. Apps without tests should set this to false.
        type: boolean
        default: false
      run-build:
        description: Run build step (next build).
        type: boolean
        default: true
      working-directory:
        description: Subdirectory to run all steps in (monorepo support).
        type: string
        default: .
      install-command:
        description: >-
          Override für den Install-Step. Leer (Default) → `npm ci` bzw.
          `pnpm install --frozen-lockfile`. Apps mit lockfile-Quirks
          (z. B. Mac-generierte Lockfiles mit lightningcss-darwin-arm64-
          Plattform-Constraints, die Linux-Build crashen) übersteuern
          das mit `npm install --no-audit --no-fund`.
        type: string
        default: ""
      run-gitleaks:
        description: >-
          Gitleaks-Secret-Scan auf der Working-Tree und Git-History.
          Default true. Bei Funden Build-Fail. Repo-spezifische
          False-Positives via `.gitleaksignore` im Repo-Root ignorieren.
        type: boolean
        default: true
      run-trivy:
        description: >-
          Trivy-Filesystem-Scan (Vuln + Misconfig + Secret-Detector,
          severity HIGH/CRITICAL). Default true. Bei Funden Build-Fail.
          Repo-Ignores via `.trivyignore` im Repo-Root.
        type: boolean
        default: true
      run-npm-audit:
        description: >-
          npm/pnpm audit als Gate (production-only, audit-level high).
          Default true. Bei vulns Build-Fail. Override per `.npmaudit-allowlist`
          ist NICHT eingebaut — bei False-Positives manuell justieren.
        type: boolean
        default: true
      run-coverage:
        description: >-
          Coverage-Report während des Test-Steps via `c8` (lcov + text).
          Sichtbarkeit, kein Gate (Plan-Doc 19 §2.3). Setzt voraus, dass
          `run-test: true`. Artifact `coverage-report` wird hochgeladen.
          c8 wird per `npx --yes` on-the-fly geholt — keine Anpassung
          in der App nötig.
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks braucht volle History für detect-mode

      - name: Gitleaks (Secret-Scan)
        if: inputs.run-gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-report.sarif || {
              echo "::error::Gitleaks fand Secrets im Repo. Siehe Output oben. False-Positives via .gitleaksignore im Repo-Root taggen."
              exit 1
            }

      - name: Trivy (Vuln + Misconfig Scan)
        if: inputs.run-trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.70.0"
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /tmp trivy
          /tmp/trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --scanners vuln,misconfig,secret \
            . || {
              echo "::error::Trivy fand HIGH/CRITICAL Findings. False-Positives via .trivyignore im Repo-Root taggen."
              exit 1
            }

      - name: Setup pnpm (if requested)
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ inputs.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install (npm)
        if: inputs.package-manager == 'npm'
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ inputs.install-command || 'npm ci' }}

      - name: Install (pnpm)
        if: inputs.package-manager == 'pnpm'
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ inputs.install-command || 'pnpm install --frozen-lockfile' }}

      - name: Audit (production deps, high+)
        if: inputs.run-npm-audit
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm audit --audit-level high --prod
          else
            npm audit --omit=dev --audit-level=high
          fi

      - name: Lint
        if: inputs.run-lint
        run: ${{ inputs.package-manager }} run lint

      - name: Typecheck
        run: ${{ inputs.package-manager }} run typecheck

      - name: Test
        if: inputs.run-test && !inputs.run-coverage
        run: ${{ inputs.package-manager }} run test

      - name: Test (with coverage via c8)
        if: inputs.run-test && inputs.run-coverage
        # c8 wickelt den `<pkg-manager> run test`-Befehl ein und
        # produziert lcov + text-Reports unter `coverage/`. `npx --yes`
        # zieht c8 ad-hoc — keine zusätzliche devDep in der App nötig.
        # Pattern funktioniert mit Node-Test, Vitest, Jest etc., solange
        # der `test`-Script Node-Code ausführt.
        run: |
          npx --yes c8@latest \
            --reporter=lcov --reporter=text \
            --reports-dir=coverage \
            ${{ inputs.package-manager }} run test

      - name: Upload coverage report
        # `always() && X` zwingt den Step auch nach failing test zu
        # laufen, damit partielle Coverage-Data nicht verloren geht.
        if: always() && inputs.run-test && inputs.run-coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Build
        if: inputs.run-build
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ inputs.package-manager }} run build
